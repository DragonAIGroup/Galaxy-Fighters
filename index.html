place(s,dt);s.enemyShot-=dt;s.dive-=dt;const active=s.foes.filter(e=>e.x>=0&&e.x<=400);if(active.length){if(s.enemyShot<=0){s.enemyShot=Math.max(.38,1.12-.07*s.wave);let e=active[Math.floor(Math.random()*active.length)];s.shots.push({x:e.x,y:e.y,v:-155,o:2},{x:e.x,y:640-e.y,v:155,o:2})}if(s.dive<=0){s.dive=Math.max(1.1,3-.12*s.wave);let f=active.filter(e=>e.ready&&!e.d);if(f.length){let e=f[Math.floor(Math.random()*f.length)];e.aim=(s.p[0].x+s.p[1].x)/2;e.d=.001;soundEvent(s,19)}}}
for(const e of s.foes)for(let i=0;i<2;i++)if(Math.abs(e.x-s.p[i].x)<16&&Math.abs((i?e.y:640-e.y)-(i?64:576))<14)hurt(s,i);
s.shots=s.shots.filter(b=>{b.y+=b.v*dt;if(b.y<43||b.y>598)return false;if(b.o<2){let e=s.foes.find(e=>e.h>0&&Math.abs(e.x-b.x)<12&&Math.min(Math.abs(e.y-b.y),Math.abs(640-e.y-b.y))<11);if(e){e.h--;soundEvent(s,e.h?4:[1,2,3][e.r]);if(!e.h){s.effects.push([e.x,e.y,s.t,0],[e.x,640-e.y,s.t,0])}return false}}let i=b.v>0?0:1;if(Math.abs(b.y-(i?64:576))<11&&Math.abs(b.x-s.p[i].x)<11){hurt(s,i);return false}return true});s.foes=s.foes.filter(e=>e.h>0);if(s.p.some(p=>!p.h)){s.over=true;s.winner=s.p[0].h?s.p[1].h?-1:0:s.p[1].h?1:-1}else if(!s.foes.length){wave(s);soundEvent(s,21)}}
function snapshot(){return [state.p,state.wave,state.over,state.winner,state.foes.filter(e=>e.x>=0).map(e=>[Math.round(e.x),Math.round(e.y),e.r,e.code,e.flags,e.h]),state.shots.map(b=>[Math.round(b.x),Math.round(b.y),b.o,b.v]),state.effects,state.t,state.events]}
function restore(a){return {p:a[0],wave:a[1],over:a[2],winner:a[3],foes:a[4].map(([x,y,r,code,flags,h])=>({x,y,r,code,flags,h})),shots:a[5].map(([x,y,o,v])=>({x,y,o,v})),effects:a[6],t:a[7],events:a[8]}}
function packet(now){for(let k=0;k<6;k++){let raw=Net.recv();if(!raw)break;let m;try{m=JSON.parse(raw)}catch(e){continue}if(!Array.isArray(m))continue;
if(role==='host'&&mode==='wait'&&m[0]==='hello'&&typeof m[1]==='string'){nonce=m[1];session=Math.random().toString(36).slice(2);lastRx=now;start()}
if(role==='guest'&&m[0]==='s'&&m[1]===nonce&&(mode==='dial'||mode==='play')&&(!session||session===m[2])){if(mode==='dial'){start();session=m[2];tick=-1}if(m[3]>tick){tick=m[3];const next=restore(m[4]);for(const id of Object.keys(next.events)){if(next.events[id]>(state.events[id]||0))playCue(Number(id))}state=next;lastRx=now;if(state.over)result()}}
if(m[1]===session&&session){if(m[0]==='i'&&role==='host'&&m[2]>inputSeq&&Number.isFinite(m[3])){peer=limit(m[3],18,382);peerFire=m[4]===true;if(Number.isInteger(m[5])&&m[5]>peerTrigger){peerTrigger=m[5];peerQueued=true}inputSeq=m[2];lastRx=now}if(m[0]==='leave'&&mode==='play'){ended('Pilot left','Your opponent left the match.');return}}}
if(now-lastTx>50){lastTx=now;if(mode==='dial')send(['hello',nonce]);if(role==='guest'&&mode==='play')send(['i',session,++seq,local,firing,trigger]);if(role==='host'&&state&&(mode==='play'||state.over))send(['s',nonce,session,++tick,snapshot()])}if((mode==='dial'||mode==='play')&&now-lastRx>9000){close();ended('Link lost','Check that both phones share a Wi-Fi network and start a new duel.')}}
function draw(){
 const {sprite,glyph,text,space}=DuelArt;
 g.imageSmoothingEnabled=false;space(g,state?.t??clock);
 if(!state){for(let i=0;i<5;i++)sprite(g,i===2?14:30,i===2?0:3,i*56+88,86+14*Math.sin(i*.75+clock*1.4),1.6);return}
 const s=state,rev=role==='guest',me=rev?1:0;
 g.save();if(rev){g.translate(400,640);g.rotate(Math.PI)}
 for(const e of s.foes){
  if(e.x<0)continue;
  const palette=e.r===0?(e.h===1?1:0):e.r===1?2:3;
  const fx=Boolean(e.flags&2),fy=Boolean(e.flags&1);
  sprite(g,e.code,palette,e.x,e.y,1.55,fx,!fy);
  sprite(g,e.code,palette,e.x,640-e.y,1.55,fx,fy);
 }
 for(const b of s.shots)sprite(g,48,b.o===2?11:9,b.x,b.y,1.25,false,b.v>0);
 for(let i=0;i<2;i++){const p=s.p[i];if(p.h&&(!p.flash||Math.floor(p.flash*15)%2===0))sprite(g,6,9,p.x,i?64:576,1.75,false,!!i)}
 for(const [x,y,at,ship] of s.effects){
  const f=Math.min(3,Math.floor(Math.max(0,s.t-at)*10));
  if(ship){for(let j=0;j<2;j++)for(let i=0;i<2;i++)sprite(g,32+f*4+i+2*j,9,x+(0.5-j)*18,y+(i-.5)*18,1.15)}
  else sprite(g,65+f,7,x,y,1.6);
 }
 g.restore();
 for(let i=0;i<2;i++){const y=i?606:12,p=s.p[i?me:1-me];
  text(g,i?'YOU':role==='ai'?'CPU':'RIVAL',i?14:4,12,y+2);
  for(let n=0;n<p.h;n++){const x=80+n*21;for(let j=0;j<2;j++)for(let k=0;k<2;k++)glyph(g,74+2*j+k,3,x+8*k,y+8*j,1)}
 }
 text(g,'STAGE '+s.wave,14,265,14);glyph(g,54,1,378,8,1.25);glyph(g,55,1,378,18,1.25);
 text(g,'RAPID FIRE',14,263,608);
}
function refreshControls(){const keys=new Set(held.values());firing=keys.has('fire');for(const b of pad.querySelectorAll('button'))b.classList.toggle('held',keys.has(b.dataset.key))}
function clearControls(){held.clear();refreshControls()}
for(const b of pad.querySelectorAll('button')){b.onpointerdown=e=>{if(mode!=='play')return;e.preventDefault();b.setPointerCapture(e.pointerId);if(b.dataset.key==='fire'){trigger++;queued=true}held.set(e.pointerId,b.dataset.key);refreshControls()};b.onpointerup=b.onpointercancel=b.onlostpointercapture=e=>{held.delete(e.pointerId);refreshControls()};b.oncontextmenu=e=>e.preventDefault()}
window.addEventListener('blur',clearControls);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearControls()})
function steer(dt){let keys=new Set(held.values()),direction=Number(keys.has('right'))-Number(keys.has('left'));local=limit(local+direction*(role==='guest'?-1:1)*305*dt,18,382)}
const keyMap={ArrowLeft:'left',ArrowRight:'right',Space:'fire'};
window.addEventListener('keydown',e=>{if(mode!=='play'||!keyMap[e.code])return;e.preventDefault();if(held.has(e.code))return;held.set(e.code,keyMap[e.code]);if(e.code==='Space'){trigger++;queued=true}refreshControls()});
window.addEventListener('keyup',e=>{if(held.delete(e.code)){e.preventDefault();refreshControls()}});
function frame(now){let dt=Math.min(.1,(now-last)/1000);last=now;clock+=dt;if(mode==='play')steer(dt);if((role==='host'||role==='guest')&&mode!=='menu')packet(now);if(mode==='play'&&role!=='guest'){acc+=dt;while(acc>=1/60){step(state,1/60);acc-=1/60}if(state.over){if(role==='host')send(['s',nonce,session,++tick,snapshot()]);result()}}draw();requestAnimationFrame(frame)}home();requestAnimationFrame(frame)
</script></body></html>
