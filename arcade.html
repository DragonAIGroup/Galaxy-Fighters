<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b19"><title>Galaga Arcade · Galaxy Fighters</title><style>
*{box-sizing:border-box}body{margin:0;background:#060914;color:#edf2ff;font:600 16px system-ui}main{height:100vh;height:100dvh;max-width:720px;margin:auto;display:flex;flex-direction:column;padding:6px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));gap:6px}header,nav{display:flex;gap:7px;align-items:center}header{justify-content:space-between}h1{font:800 20px monospace;margin:.2em;color:#ffe68b}a{color:#9debdc}#screen{background:#000;flex:1;min-height:0;position:relative}#game{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}button{appearance:none;color:#eaf7ff;background:#19304a;border:1px solid #486383;border-radius:5px;min-height:44px;flex:1;font:700 15px monospace;touch-action:none;user-select:none;-webkit-user-select:none}button:active{background:#4e718c}button:last-child{color:#1c1520;background:#ffe68b}p{margin:0;color:#c5cde0;font-size:13px}nav[hidden]{display:none}
</style></head><body><main><header><h1>GALAGA</h1><a href="./">Galaxy Fighters menu</a></header><div id="screen"><canvas id="game" width="224" height="288" aria-label="Galaga arcade screen"></canvas></div><p id="status" role="status">Loading the arcade machine…</p><nav id="credit" hidden><button data-id="2">Coin</button><button data-id="3">1P Start</button></nav><nav id="stick" hidden><button data-id="6">◀ Left</button><button data-id="7">Right ▶</button><button data-id="0">Fire</button></nav></main><script>
let board, audioContext, audioAt=0;
function activateSound(){try{audioContext??=new AudioContext();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{})}catch{}}
const held=new Map();let rapid,phase=false;
function control(i,v){board?.input(i,Boolean(v))}
function press(key,id){activateSound();if(held.has(key))return;const repeat=[...held.values()].includes(id);held.set(key,id);if(repeat)return;control(id,1);if(id===0){phase=true;rapid=setInterval(()=>{phase=!phase;control(0,Number(phase))},65)}}
function release(key){const id=held.get(key);held.delete(key);if(id===undefined||[...held.values()].includes(id))return;if(id===0)clearInterval(rapid);control(id,0)}
for(const b of document.querySelectorAll('[data-id]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(e.pointerId,+b.dataset.id)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=e=>release(e.pointerId)}
const keys={ArrowLeft:6,ArrowRight:7,Space:0,Digit5:2,Digit1:3};for(const type of ['keydown','keyup'])window.addEventListener(type,e=>{if(!(e.code in keys)||!board)return;e.preventDefault();e.stopImmediatePropagation();if(type==='keydown')press(e.code,keys[e.code]);else release(e.code)},true);
function reset(){for(const k of [...held.keys()])release(k)}window.addEventListener('blur',reset);document.addEventListener('visibilitychange',()=>{if(document.hidden)reset()});
async function loadSet(){
 const response=await fetch('./galaga.zip');if(!response.ok)throw Error('ROM download failed');
 const data=new Uint8Array(await response.arrayBuffer()),v=new DataView(data.buffer),files={};
 let i=0;
 while(i+30<=data.length&&v.getUint32(i,true)===0x04034b50){
  const length=v.getUint32(i+18,true),nameLen=v.getUint16(i+26,true),extra=v.getUint16(i+28,true),start=i+30+nameLen+extra;
  const name=new TextDecoder().decode(data.subarray(i+30,i+30+nameLen)),bytes=data.slice(start,start+length);
  const method=v.getUint16(i+8,true);
  if(method===0)files[name]=bytes;
  else if(method===8)files[name]=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  else throw Error('Unknown ZIP compression');
  i=start+length;
 }
 if(Object.keys(files).length!==14)throw Error('Incomplete Galaga set');
 return files;
}
function playAudio(samples){
 if(audioContext?.state!=='running')return;
 if(audioAt>audioContext.currentTime+.13)return;
 const buffer=audioContext.createBuffer(1,samples.length,48000);buffer.copyToChannel(samples,0);
 const source=audioContext.createBufferSource();source.buffer=buffer;source.connect(audioContext.destination);
 audioAt=Math.max(audioContext.currentTime+.018,audioAt);source.start(audioAt);audioAt+=buffer.duration;
}
async function boot(){
 const [{Board},rom]=await Promise.all([import('./board.js'),loadSet()]);
 board=new Board(rom);const g=document.querySelector('#game').getContext('2d'),frame=g.createImageData(224,288);
 const paint=()=>{new Uint32Array(frame.data.buffer).set(board.render());g.putImageData(frame,0,0)};
 // Run the cabinet's power-on RAM checks before enabling credits.
 for(let n=0;n<900;n+=30){for(let j=0;j<30;j++)board.frame();paint();await new Promise(requestAnimationFrame)}
 document.querySelector('#credit').hidden=document.querySelector('#stick').hidden=false;
 document.querySelector('#status').textContent='Press Coin, then 1P Start. Hold Fire for rapid shots. Keyboard: 5, 1, arrow keys, Space.';
 let old=performance.now(),acc=0;
 function refresh(now){acc+=Math.min(66,now-old);old=now;while(acc>=1000/60){playAudio(board.frame());acc-=1000/60}paint();requestAnimationFrame(refresh)}
 requestAnimationFrame(refresh);
}
boot().catch(error=>{document.querySelector('#status').textContent='Could not start the arcade machine. '+error.message+'. Reload to retry.'});
</script></body></html>
