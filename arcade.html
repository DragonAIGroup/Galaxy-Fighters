<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b19"><title>Galaga Arcade · Galaxy Fighters</title><style>
*{box-sizing:border-box}body{margin:0;background:#060914;color:#edf2ff;font:600 16px system-ui}main{height:100vh;height:100dvh;max-width:720px;margin:auto;display:flex;flex-direction:column;padding:6px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));gap:6px}header,nav{display:flex;gap:7px;align-items:center}header{justify-content:space-between}h1{font:800 20px monospace;margin:.2em;color:#ffe68b}a{color:#9debdc}#screen{background:#000;flex:1;min-height:0;position:relative}#game{width:100%;height:100%}button{appearance:none;color:#eaf7ff;background:#19304a;border:1px solid #486383;border-radius:5px;min-height:44px;flex:1;font:700 15px monospace;touch-action:none;user-select:none;-webkit-user-select:none}button:active{background:#4e718c}button:last-child{color:#1c1520;background:#ffe68b}p{margin:0;color:#c5cde0;font-size:13px}nav[hidden]{display:none}
</style></head><body><main><header><h1>GALAGA</h1><a href="./">Galaxy Fighters menu</a></header><div id="screen"><div id="game"></div></div><p id="status" role="status">Loading the arcade machine…</p><nav id="credit" hidden><button data-id="2">Coin</button><button data-id="3">1P Start</button></nav><nav id="stick" hidden><button data-id="6">◀ Left</button><button data-id="7">Right ▶</button><button data-id="0">Fire</button></nav></main><script>
window.EJS_player='#game';window.EJS_core='fbneo';window.EJS_gameUrl='./galaga.zip';window.EJS_gameName='galaga';window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_startOnLoaded=true;window.EJS_disableDatabases=true;window.EJS_mobileGamepad=false;
const held=new Map();let rapid,phase=false;
function control(i,v){window.EJS_emulator?.gameManager?.simulateInput(0,i,v)}
function press(key,id){if(held.has(key))return;const repeat=[...held.values()].includes(id);held.set(key,id);if(repeat)return;control(id,1);if(id===0){phase=true;rapid=setInterval(()=>{phase=!phase;control(0,Number(phase))},65)}}
function release(key){const id=held.get(key);held.delete(key);if(id===undefined||[...held.values()].includes(id))return;if(id===0)clearInterval(rapid);control(id,0)}
for(const b of document.querySelectorAll('[data-id]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(e.pointerId,+b.dataset.id)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=e=>release(e.pointerId)}
const keys={ArrowLeft:6,ArrowRight:7,Space:0,Digit5:2,Digit1:3};for(const type of ['keydown','keyup'])window.addEventListener(type,e=>{if(!(e.code in keys)||!window.EJS_emulator?.gameManager)return;e.preventDefault();e.stopImmediatePropagation();if(type==='keydown')press(e.code,keys[e.code]);else release(e.code)},true);
function reset(){for(const k of [...held.keys()])release(k)}window.addEventListener('blur',reset);document.addEventListener('visibilitychange',()=>{if(document.hidden)reset()});
window.EJS_onGameStart=()=>{document.querySelector('#credit').hidden=document.querySelector('#stick').hidden=false;document.querySelector('#status').textContent='After the machine boots, press Coin, then 1P Start. Hold Fire for rapid shots.'};
</script><script src="https://cdn.emulatorjs.org/stable/data/loader.js" onerror="document.querySelector('#status').textContent='The arcade emulator could not load. Reload to retry.'"></script></body></html>
